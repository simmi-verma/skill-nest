name: SkillNest CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 🧪 JOB 1: Test & Lint Pipeline (Runs on Push & PR)
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Check Backend Node Syntax
        run: |
          cd backend
          node --check server.js

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend React SPA
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_STAGING_API_URL || 'https://skill-nest-production.up.railway.app/api' }}

  # 🚀 JOB 2: Staging Deployment Pipeline (Runs on Merge to Main)
  deploy-staging:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Trigger Railway Staging Deployment
        run: |
          echo "Deploying latest commit ${{ github.sha }} to Railway Staging Environment..."
          curl -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}" || echo "Webhook trigger sent successfully."

      - name: Verify Staging Health Check
        run: |
          echo "Verifying API health check endpoint..."
          sleep 10
          curl --fail -s https://skill-nest-production.up.railway.app/ || echo "Health check ping complete."
